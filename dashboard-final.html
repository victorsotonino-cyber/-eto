
<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nexus Control Center • Secure</title>
<style>
:root{--bg:#07060a;--panel:#0e0b12;--line:#30203b;--accent:#9b4dff;--accent2:#c78bff;--text:#f7f2ff;--muted:#9c90a8;--green:#57f287;--yellow:#f5c451;--red:#ed4245}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 62% -15%,#34104d 0,#110a17 35%,#07060a 72%);color:var(--text);font:14px Inter,system-ui,sans-serif}body:before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(circle at 15% 80%,rgba(155,77,255,.08),transparent 30%),radial-gradient(circle at 90% 20%,rgba(199,139,255,.06),transparent 25%)}button,input,textarea,select{font:inherit}
.shell{display:flex;min-height:100vh}.side{width:245px;border-right:1px solid var(--line);background:#08070bed;padding:20px 14px;position:sticky;top:0;height:100vh}.brand{font-size:24px;font-weight:900;padding:7px 12px 24px}.brand b{color:var(--accent2)}.brand small{display:block;font-size:9px;color:#756980;letter-spacing:.18em;margin-top:4px}.section{font-size:10px;color:#71617e;letter-spacing:.18em;padding:10px}.nav button{width:100%;padding:11px 12px;margin:2px 0;border:1px solid transparent;border-radius:10px;background:transparent;color:#afa4b7;text-align:left;cursor:pointer}.nav button:hover,.nav button.active{background:#1a1023;border-color:#44245a;color:#fff}.side-bottom{position:absolute;left:14px;right:14px;bottom:18px}
.main{flex:1;min-width:0;max-width:1320px;padding:25px}.top{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:18px}.eyebrow{font-size:10px;color:#9a73b9;letter-spacing:.2em;text-transform:uppercase}.top h1{margin:4px 0;font-size:29px}.guild{min-width:250px;background:#0b0810;border:1px solid #3b2449;color:#fff;border-radius:9px;padding:10px;outline:none}.hero,.card{background:linear-gradient(145deg,#17101ff4,#0c0910f4);border:1px solid #2f1c3f;border-radius:15px}.hero{padding:24px;margin-bottom:15px}.card{padding:17px;margin-bottom:15px}.hero h2,.card h2{margin:4px 0 8px}.muted{color:var(--muted);line-height:1.55}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:13px}.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.stat{font-size:27px;font-weight:900;margin-top:6px}.purple{color:var(--accent2)}.green{color:var(--green)}.yellow{color:var(--yellow)}
.input,.textarea{width:100%;background:#0a0710;border:1px solid #3d274b;color:#fff;border-radius:9px;padding:11px;margin:7px 0 12px;outline:none}.input:focus,.textarea:focus,.guild:focus{border-color:var(--accent)}.textarea{min-height:75px;resize:vertical}label{display:block;font-size:13px;font-weight:700;color:#d8cde0}.btn{border:1px solid #7f38c1;background:linear-gradient(135deg,#9239ff,#6120a0);color:#fff;border-radius:9px;padding:10px 14px;cursor:pointer;font-weight:800}.btn.secondary{background:#1b1322;border-color:#493554}.btn.danger{background:#4c1a27;border-color:#7e2c40}.btn:disabled{opacity:.55;cursor:not-allowed}.row{display:flex;gap:9px;flex-wrap:wrap;align-items:center}.command{padding:10px 12px;border:1px solid #2c1a36;background:#0a080e;border-radius:8px;margin:7px 0;font-family:ui-monospace,monospace}.command small{display:block;color:var(--muted);font-family:system-ui,sans-serif;margin-top:4px}.event{display:grid;grid-template-columns:120px minmax(0,1fr) auto;gap:12px;padding:10px 0;border-bottom:1px solid #211826}.event:last-child{border-bottom:0}.event-type{font-weight:800;color:#d5b7ec}.event-user{font-weight:700}.event-meta{color:var(--muted);font-size:12px}.logbox{max-height:560px;overflow:auto}.q{background:#0b0810;border:1px solid #351b44;border-radius:9px;padding:10px;margin:8px 0}.q-num{font-weight:900;color:var(--accent2);margin-bottom:6px}.pill{display:inline-flex;align-items:center;gap:7px;padding:5px 9px;border:1px solid #4a3158;background:#1a1022;border-radius:999px;font-size:12px}.dot{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 8px var(--green)}.empty{padding:32px;text-align:center;color:var(--muted)}.statusbar{display:flex;gap:8px;flex-wrap:wrap;margin-top:11px}.login{max-width:460px;margin:14vh auto;padding:30px}.hidden{display:none!important}.toast{position:fixed;right:18px;bottom:18px;background:#1a1022;border:1px solid #70429a;padding:12px 15px;border-radius:10px;display:none;z-index:20}
@media(max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}.side{width:215px}.main{padding:18px}}@media(max-width:650px){.shell{display:block}.side{position:relative;width:100%;height:auto;border-right:0;border-bottom:1px solid var(--line)}.side-bottom{position:static;margin-top:12px}.nav{display:grid;grid-template-columns:1fr 1fr}.main{padding:13px}.grid,.grid2{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}.guild{width:100%}.event{grid-template-columns:95px 1fr}.event-meta{display:none}}
</style>
</head>
<body>
<div id="login" class="card login hidden">
  <div class="eyebrow">🔐 NEXUS CONTROL CENTER</div>
  <h1>Panel privado</h1>
  <p class="muted">Acceso protegido. Solo pueden existir <b>2 sesiones activas</b> al mismo tiempo.</p>
  <label>🔑 Contraseña del panel</label>
  <input id="panelPassword" class="input" type="password" autocomplete="current-password" placeholder="Introduce la contraseña">
  <div class="row">
    <button class="btn" id="unlockPanel">🔓 Desbloquear panel</button>
    <a class="btn secondary" id="discordLogin" href="/auth/discord" style="pointer-events:none;opacity:.45">Discord →</a>
  </div>
  <p id="loginStatus" class="muted" style="margin-top:12px"></p>
  <div class="card" style="margin-top:16px;padding:13px;background:#0b0810">
    <b>👑 Dueños</b>
    <div style="margin-top:8px">👑 <b>Dueño</b> · Camtrax2024</div>
    <div style="margin-top:5px">🛠️ <b>Dev</b> · srkid</div>
  </div>
</div>
<div id="app" class="shell hidden">
  <aside class="side">
    <div class="brand">Nexus <b>AI</b><small>DISCORD CONTROL CENTER</small></div>
    <div class="card" style="padding:12px;margin:0 0 14px">
      <div class="muted">👑 PROPIETARIOS</div>
      <div style="margin-top:8px">👑 <b>Camtrax2024</b><small class="muted">Dueño</small></div>
      <div style="margin-top:7px">🛠️ <b>srkid</b><small class="muted">Dev</small></div>
    </div>
    <div class="section">CONTROL</div>
    <div class="nav">
      <button data-page="home" class="active">⌂ &nbsp; Resumen</button>
      <button data-page="activity">◉ &nbsp; Actividad</button>
      <button data-page="tickets">◈ &nbsp; Tickets</button>
      <button data-page="moderation">◆ &nbsp; Moderación</button>
      <button data-page="applications">✦ &nbsp; Postulaciones</button>
      <button data-page="vouches">★ &nbsp; Vouches</button>
      <button data-page="logs">▤ &nbsp; Logs</button>
      <button data-page="roles">♙ &nbsp; Roles</button>
      <button data-page="commands">⌘ &nbsp; Comandos</button>
      <button data-page="emojis">✨ &nbsp; Emojis</button>
    </div>
    <div class="side-bottom"><button class="btn secondary" id="music" style="width:100%;margin-bottom:8px">🎵 Música de entrada</button>
    <button class="btn secondary" id="logout" style="width:100%">Cerrar sesión</button></div>
  </aside>
  <main class="main">
    <div class="top">
      <div><div class="eyebrow">Nexus Control Center</div><h1 id="title">Resumen</h1></div>
      <select id="guild" class="guild"></select>
    </div>
    <section id="page"></section>
  </main>
</div>
<audio id="introMusic" preload="auto" loop src="/assets/nuts.mp3"></audio>
<div id="toast" class="toast"></div>
<script>
const $=s=>document.querySelector(s);
const state={guild:null,guilds:[],config:{},commands:[],csrf:null};
const titles={home:"Resumen",activity:"Actividad",tickets:"Tickets",moderation:"Moderación",applications:"Postulaciones",vouches:"Vouches",logs:"Logs",roles:"Roles",commands:"Comandos",emojis:"Emojis"};
let current="home",refreshTimer=null,lastSave=0;
function esc(v){return String(v??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]))}
function toast(t){const x=$("#toast");x.textContent=t;x.style.display="block";clearTimeout(window.__toast);window.__toast=setTimeout(()=>x.style.display="none",2200)}
async function api(url,opt={}){const options={...opt,headers:{...(opt.headers||{})}};if(options.method&&options.method!=="GET"&&state.csrf)options.headers["x-csrf-token"]=state.csrf;const r=await fetch(url,options);let j={};try{j=await r.json()}catch{}if(r.status===401){location.reload();throw Error("auth")}if(!r.ok)throw Error(j.error||"Error de servidor");return j}
function active(p){document.querySelectorAll(".nav button").forEach(b=>b.classList.toggle("active",b.dataset.page===p))}
function commandRows(commands){return(commands||[]).map(c=>{const sub=(c.options||[]).filter(o=>o.type===1||o.type===2);const names=sub.length?sub.map(s=>"/"+c.name+" "+s.name).join(" • "):"/"+c.name;return'<div class="command"><b>'+esc(names)+'</b><small>'+esc(c.description||"Sin descripción")+'</small></div>'}).join("")}
function eventRows(events){if(!events?.length)return'<div class="empty">Todavía no hay actividad sincronizada.</div>';return'<div class="logbox">'+events.slice(0,500).map(e=>'<div class="event"><div class="event-type">'+esc(e.type)+'</div><div><div class="event-user">'+esc(e.user||"Sistema")+'</div><div class="event-meta">'+esc(e.details||"Sin detalles")+'</div></div><div class="event-meta">'+new Date(Number(e.at)||Date.now()).toLocaleString("es-ES")+'</div></div>').join("")+'</div>'}
async function load(){if(!state.guild)return;state.config=await api("/api/config/"+state.guild.id);if(current!=="applications")render(current)}
function syncPill(c){const text=c.botOnline?(c.lastBotSyncAt?"Sincronizado · "+new Date(c.lastBotSyncAt).toLocaleTimeString("es-ES"):"Bot conectado"):"Esperando al bot";return'<span class="pill"><span class="dot" style="background:'+(c.botOnline?'var(--green)':'var(--yellow)')+'"></span>'+esc(text)+'</span>'}
async function save(p,button){if(!state.guild)return;if(button){button.disabled=true;button.dataset.old=button.textContent;button.textContent="Guardando…"}try{state.config=await api("/api/config/"+state.guild.id,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(p)});lastSave=Date.now();toast("✓ Guardado correctamente");if(current==="applications")render("applications");else render(current)}catch(e){toast("❌ "+e.message)}finally{if(button){button.disabled=false;button.textContent=button.dataset.old||"Guardar"}}}
function render(p){
 current=p;active(p);$("#title").textContent=titles[p]||p;const c=state.config||{};
 if(p==="home"){
  $("#page").innerHTML='<div class="hero"><div class="eyebrow">NEXUS CONTROL</div><h2>Panel completo del servidor.</h2><p class="muted">La configuración usa versiones para evitar perder cambios. El bot devuelve su estado para restaurar el panel después de reinicios.</p><div class="statusbar">'+syncPill(c)+'<span class="pill">Versión '+esc(c.configVersion||0)+'</span></div></div><div class="grid"><div class="card"><div class="muted">Tickets abiertos</div><div class="stat">'+esc(c.openTickets||0)+'</div></div><div class="card"><div class="muted">Advertencias</div><div class="stat">'+esc(c.warnings||0)+'</div></div><div class="card"><div class="muted">Vouches</div><div class="stat">'+esc(c.vouchTotal||0)+'</div></div><div class="card"><div class="muted">Estado</div><div class="stat '+(c.botOnline?"green":"yellow")+'">'+(c.botOnline?"ONLINE":"PENDIENTE")+'</div></div></div><div class="grid2"><div class="card"><h2>Configuración</h2><p class="muted">Categoría: '+(c.categoryId?'<span class="pill">'+esc(c.categoryId)+'</span>':"No configurada")+'</p><p class="muted">Staff: '+(c.staffRoleId?'<span class="pill">'+esc(c.staffRoleId)+'</span>':"No configurado")+'</p><p class="muted">Logs: '+(c.logsChannelId?'<span class="pill">'+esc(c.logsChannelId)+'</span>':"No configurado")+'</p><p class="muted">Vouches: '+(c.vouchChannelId?'<span class="pill">'+esc(c.vouchChannelId)+'</span>':"Cualquier canal")+'</p></div><div class="card"><h2>Actividad reciente</h2>'+eventRows(c.activity||[])+'</div></div>';return;
 }
 if(p==="activity"){
  $("#page").innerHTML='<div class="hero"><div class="eyebrow">LIVE MONITOR</div><h2>Actividad del servidor</h2><p class="muted">El bot sincroniza los últimos eventos periódicamente.</p><div class="row"><button class="btn" id="refresh">Actualizar</button>'+syncPill(c)+'</div></div><div class="card">'+eventRows(c.activity||[])+'</div>';$("#refresh").onclick=()=>load().catch(e=>toast("❌ "+e.message));return;
 }
 if(p==="tickets"){
  $("#page").innerHTML='<div class="hero"><div class="eyebrow">TICKETS</div><h2>Configuración de tickets</h2><p class="muted">Estos valores son los mismos que usa /ticket setup.</p></div><div class="card"><div class="grid2"><div><label>ID categoría</label><input class="input" id="cat" value="'+esc(c.categoryId||"")+'"></div><div><label>ID rol Staff</label><input class="input" id="staff" value="'+esc(c.staffRoleId||"")+'"></div></div><label>ID canal de logs</label><input class="input" id="log" value="'+esc(c.logsChannelId||"")+'"><button class="btn" id="save">Guardar configuración</button></div><div class="card"><h2>Estado</h2><p class="muted">Tickets abiertos: <b>'+esc(c.openTickets||0)+'</b> · versión: <b>'+esc(c.configVersion||0)+'</b></p></div><div class="card"><h2>Comandos relacionados</h2>'+commandRows(state.commands.filter(x=>x.name==="ticket"||x.name==="modlog"))+'</div>';
  $("#save").onclick=()=>save({categoryId:$("#cat").value.trim()||null,staffRoleId:$("#staff").value.trim()||null,logsChannelId:$("#log").value.trim()||null},$("#save"));return;
 }
 if(p==="moderation"){
  $("#page").innerHTML='<div class="hero"><div class="eyebrow">MODERATION</div><h2>Control y seguridad</h2><p class="muted">Lista sincronizada directamente desde la definición del bot.</p></div><div class="card">'+commandRows(state.commands.filter(x=>["modlog","ban","unban","kick","timeout","untimeout","warn","warnings","clearwarns","clear","lock","unlock","slowmode","nick","userinfo","serverinfo"].includes(x.name)))+'</div>';return;
 }
 if(p==="applications"){
  const box=(key,title,arr)=>'<div class="card"><div class="row" style="justify-content:space-between"><h2>'+esc(title)+'</h2><button class="btn secondary" data-add="'+esc(key)+'">+ Añadir</button></div><p class="muted">Máximo 20 preguntas, 300 caracteres cada una.</p>'+arr.map((q,i)=>'<div class="q"><div class="q-num">Pregunta '+(i+1)+'</div><textarea class="textarea" data-q="'+esc(key)+'">'+esc(q)+'</textarea><button class="btn danger" data-del="'+esc(key)+'" data-i="'+i+'">Eliminar</button></div>').join("")+'<button class="btn" data-save="'+esc(key)+'">Guardar preguntas</button></div>';
  $("#page").innerHTML='<div class="hero"><div class="eyebrow">APPLICATIONS</div><h2>Postulaciones</h2><p class="muted">Edita exactamente las preguntas de /post-staff y /post-alter.</p></div>'+box("staffQuestions","Post-Staff",c.staffQuestions||[])+box("alterQuestions","Post-Alter",c.alterQuestions||[])+'<div class="card">'+commandRows(state.commands.filter(x=>x.name==="post-staff"||x.name==="post-alter"))+'</div>';
  document.querySelectorAll("[data-add]").forEach(b=>b.onclick=()=>{state.config[b.dataset.add]=[...(state.config[b.dataset.add]||[]),"Nueva pregunta"];render("applications")});
  document.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{state.config[b.dataset.del]=[...(state.config[b.dataset.del]||[])].filter((_,i)=>i!==Number(b.dataset.i));render("applications")});
  document.querySelectorAll("[data-save]").forEach(b=>b.onclick=()=>{const key=b.dataset.save;const values=[...document.querySelectorAll("[data-q='"+key+"']")].map(x=>x.value.trim()).filter(Boolean).slice(0,20);save({[key]:values},b)});return;
 }
 if(p==="vouches"){
  $("#page").innerHTML='<div class="hero"><div class="eyebrow">VOUCHES</div><h2>Reputación</h2><p class="muted">Total registrado por el bot: <b>'+esc(c.vouchTotal||0)+'</b>.</p></div><div class="card"><label>ID canal de vouches</label><input class="input" id="vc" value="'+esc(c.vouchChannelId||"")+'" placeholder="Vacío = cualquier canal"><button class="btn" id="save">Guardar canal</button></div><div class="card">'+commandRows(state.commands.filter(x=>x.name==="vouch"))+'</div>';$("#save").onclick=()=>save({vouchChannelId:$("#vc").value.trim()||null},$("#save"));return;
 }
 if(p==="logs"){
  $("#page").innerHTML='<div class="hero"><div class="eyebrow">LOGS</div><h2>Registro central</h2><p class="muted">Canal utilizado para logs de tickets y moderación.</p></div><div class="card"><label>ID canal de logs</label><input class="input" id="lg" value="'+esc(c.logsChannelId||"")+'"><div class="row"><button class="btn" id="save">Guardar</button><button class="btn secondary" id="off">Desactivar</button></div></div><div class="card">'+eventRows(c.activity||[])+'</div>';$("#save").onclick=()=>save({logsChannelId:$("#lg").value.trim()||null},$("#save"));$("#off").onclick=()=>save({logsChannelId:null},$("#off"));return;
 }
 if(p==="roles"){
  $("#page").innerHTML='<div class="hero"><div class="eyebrow">ROLES</div><h2>Permisos de Nexus</h2><p class="muted">El rol configurado aquí será usado por el sistema de tickets.</p></div><div class="card"><label>ID rol Staff</label><input class="input" id="rl" value="'+esc(c.staffRoleId||"")+'"><button class="btn" id="save">Guardar rol</button></div><div class="card"><h2>Acceso completo</h2><span class="pill">1554252558359470182</span></div>';$("#save").onclick=()=>save({staffRoleId:$("#rl").value.trim()||null},$("#save"));return;
 }
 if(p==="emojis"){
  $( "#page" ).innerHTML='<div class="hero"><div class="eyebrow">✨ EMOJI MANAGER</div><h2>Emojis personalizados</h2><p class="muted">El bot incluye <b>/emoji</b> para crear, listar y borrar emojis del servidor. Usa prefijos para mantenerlos ordenados: <b>staff_</b>, <b>mod_</b>, <b>owner_</b>, <b>reclaim_</b> o <b>emoji_</b>.</p><div class="grid"><div class="card"><div class="stat">🛡️</div><b>Staff</b><p class="muted">staff_nombre</p></div><div class="card"><div class="stat">🔨</div><b>Moderación</b><p class="muted">mod_nombre</p></div><div class="card"><div class="stat">👑</div><b>Owner</b><p class="muted">owner_nombre</p></div><div class="card"><div class="stat">🎟️</div><b>Reclaim</b><p class="muted">reclaim_nombre</p></div></div><div class="card"><h2>Comandos</h2><div class="command"><b>/emoji lista</b><small>Ver los emojis personalizados agrupados.</small></div><div class="command"><b>/emoji crear</b><small>Crear un emoji desde una imagen y elegir su categoría.</small></div><div class="command"><b>/emoji borrar</b><small>Eliminar un emoji por ID.</small></div></div></div>';return;
 } if(p==="commands"){
  $("#page").innerHTML='<div class="hero"><div class="eyebrow">COMMAND CENTER</div><h2>Comandos sincronizados</h2><p class="muted">La lista viene directamente de la definición actual del bot.</p></div><div class="card">'+commandRows(state.commands)+'</div>';return;
 }
}
async function boot(){
 try{
  const me=await api("/api/me");if(!me.authenticated){
  $("#login").classList.remove("hidden");
  const unlock=$("#unlockPanel"), pass=$("#panelPassword"), link=$("#discordLogin"), status=$("#loginStatus");
  unlock.onclick=async()=>{unlock.disabled=true;status.textContent="Comprobando…";try{await api("/auth/password",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({password:pass.value})});status.textContent="✅ Contraseña correcta. Ya puedes entrar con Discord.";link.style.pointerEvents="auto";link.style.opacity="1";toast("🔓 Panel desbloqueado");}catch(e){status.textContent="❌ "+e.message;}finally{unlock.disabled=false;}};
  pass.onkeydown=e=>{if(e.key==="Enter")unlock.click();};
  return;
}
  state.csrf=me.csrf;$("#app").classList.remove("hidden");
  state.guilds=await api("/api/guilds");if(!state.guilds.length)throw Error("No tienes acceso al servidor configurado.");
  state.guild=state.guilds[0];$("#guild").innerHTML=state.guilds.map(g=>'<option value="'+esc(g.id)+'">'+esc(g.name)+'</option>').join("");
  $("#guild").onchange=async()=>{const picked=state.guilds.find(g=>g.id===$("#guild").value);state.guild=picked||state.guilds[0];try{await load()}catch(e){toast("❌ "+e.message)}};
  try{state.commands=await api("/api/commands")}catch{state.commands=[]}
  await load();render("home");
  clearInterval(refreshTimer);refreshTimer=setInterval(()=>{if(["home","activity","tickets","logs","vouches"].includes(current))load().catch(()=>{})},4000);
 }catch(e){if(e.message==="auth"){location.reload();return}document.body.innerHTML='<div class="card login"><h1>Nexus Control</h1><p class="muted">'+esc(e.message)+'</p><a class="btn" href="/auth/discord">Volver a iniciar sesión</a></div>'}
}
document.querySelectorAll(".nav button").forEach(b=>b.onclick=()=>render(b.dataset.page));
$("#music").onclick=async()=>{const a=$("#introMusic");try{if(a.paused){await a.play();$("#music").textContent="⏸️ Pausar música";toast("🎵 Música activada");}else{a.pause();$("#music").textContent="🎵 Música de entrada";}}catch{toast("ℹ️ Falta /assets/nuts.mp3; el panel ya está preparado para ese archivo.");}};$("#logout").onclick=()=>location.href="/auth/logout";
boot();
</script>
</body>
</html>
